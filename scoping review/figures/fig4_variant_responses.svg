<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Selected variant-specific responses to 4-PBA</title><desc>Four selected variant investigations: NPHS1 six of sixteen improved, ABCB4 two of four improved, SFTPC one of three improved, SLC16A2 one of three showed restored T3 transport. The non-improved count refers only to the reported endpoints.</desc><rect width="1280" height="720" fill="#fff"/><text x="50" y="65" font-size="33" font-weight="700" font-family="Arial,sans-serif" fill="#283943">Selected variant-specific responses to 4-PBA</text><text x="180" y="185" font-family="Arial,sans-serif" font-size="26" text-anchor="end" fill="#2a3a44">NPHS1</text><rect x="205" y="155" width="270" height="43" fill="#2ca02c"/><rect x="475" y="155" width="450" height="43" fill="#c7d9e2"/><text x="935" y="186" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#24343c">6/16</text><text x="180" y="294" font-family="Arial,sans-serif" font-size="26" text-anchor="end" fill="#2a3a44">ABCB4</text><rect x="205" y="264" width="90" height="43" fill="#2ca02c"/><rect x="295" y="264" width="90" height="43" fill="#c7d9e2"/><text x="395" y="295" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#24343c">2/4</text><text x="180" y="403" font-family="Arial,sans-serif" font-size="26" text-anchor="end" fill="#2a3a44">SFTPC</text><rect x="205" y="373" width="45" height="43" fill="#2ca02c"/><rect x="250" y="373" width="90" height="43" fill="#c7d9e2"/><text x="350" y="404" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#24343c">1/3</text><text x="180" y="512" font-family="Arial,sans-serif" font-size="26" text-anchor="end" fill="#2a3a44">SLC16A2</text><rect x="205" y="482" width="45" height="43" fill="#2ca02c"/><rect x="250" y="482" width="90" height="43" fill="#c7d9e2"/><text x="350" y="513" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#24343c">1/3</text><rect x="245" y="610" width="22" height="22" fill="#2ca02c"/><text x="278" y="628" font-family="Arial,sans-serif" font-size="20">Improvement in studied endpoint</text><rect x="664" y="610" width="22" height="22" fill="#c7d9e2"/><text x="698" y="628" font-family="Arial,sans-serif" font-size="20">No comparable improvement</text><text x="70" y="685" font-family="Arial,sans-serif" font-size="17" fill="#54616b">Different assays and endpoints are not equivalent measures of functional rescue.</text></svg>