<text x="984.0" y="399" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#21272c">abstract screening</text>
<text x="984.0" y="447" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#21272c">n = 279</text>
<text x="984.0" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#21272c">Not included in present synthesis</text>
<text x="984.0" y="627" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#21272c">n = 85</text>
<text x="150" y="981" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#4b535b">Reported PubMed screening: 472 identified; 279 excluded.</text>
<text x="150" y="1011" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#4b535b">193 in the original worklist; 108 included; 85 outside the synthesis.</text>
<text x="150" y="1041" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#4b535b">The earlier 18/67 eligibility split has not been reconciled to individual studies.</text>
