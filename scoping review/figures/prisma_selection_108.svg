<text x="416.0" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#21272c">PubMed publications identified</text>
<text x="416.0" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#21272c">n = 472</text>
<text x="416.0" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#21272c">Title and abstract screening</text>
<text x="416.0" y="433" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#21272c">n = 472</text>
<text x="416.0" y="599" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#21272c">Shortlisted for further assessment</text>
<text x="416.0" y="639" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#21272c">n = 193</text>
<text x="416.0" y="855" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#21272c">Included in the present synthesis</text>
<text x="416.0" y="900" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#21272c">n = 108</text>
