<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" width="1280" height="1080" role="img" aria-labelledby="prisma-title prisma-description">
<title id="prisma-title">Identification, Screening, and Selection of Studies</title>
<desc id="prisma-description">PRISMA-style study selection diagram: 472 publications identified; 279 screened out; 193 in the original further-assessment worklist; 108 included in present synthesis; 85 not included. The suggested breakdown of 18 excluded and 67 awaiting full-text assessment has not been reconciled to individual publications.</desc>
